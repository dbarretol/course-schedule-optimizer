[project]
name = "course-schedule-optimizer"
version = "0.1.0"
description = "Course enrollment optimizer built on OR-Tools CP-SAT: expands real sessions, detects schedule clashes and splits courses across several accounts, maximizing by priority. Exports to iCalendar (.ics)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.14.6206",
]

[project.scripts]
course-scheduler = "course_scheduler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
